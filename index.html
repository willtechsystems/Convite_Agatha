<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="robots" content="noindex, nofollow">
  
  <title>Convite Especial</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- VÍDEO DE FUNDO (Roda em loop ao fundo de todo o convite) -->
  <video autoplay loop muted playsinline id="bg-video">
    <source src="assets/fundo.mp4" type="video/mp4">
  </video>

  <main class="card-container">
    
    <!-- TELA 1: CAPA COM A IMAGEM DO ENVELOPE (envelope.png) -->
    <div id="tela-envelope" class="secao-envelope" onclick="abrirConvite()">
      <h2 class="titulo-envelope">Você recebeu um convite especial!</h2>
      <p class="instrucao-envelope">Clique no envelope para abrir</p>
      
      <div class="envelope-wrapper">
        <img src="assets/envelope.png" alt="Envelope do Convite" id="img-envelope">
      </div>
    </div>

    <!-- TELA 2: CONTEÚDO PRINCIPAL -->
    <div id="tela-principal" class="secao-principal oculto">
      <span class="subtitulo-topo">VAMOS COMEMORAR!</span>
      <h1 id="txt-nome" class="nome-destaque">Ágatha</h1>
      <h2 id="txt-idade" class="idade-destaque">1 ANO</h2>

      <div class="bloco-data-local">
        <p id="txt-data" class="txt-data">SÁBADO, 05 DE SETEMBRO</p>
        <p id="txt-horario" class="txt-horario">19:00h</p>
        <p id="txt-local" class="txt-local">Casa de Eventos</p>
      </div>

      <!-- BOTÕES DE INTERAÇÃO -->
      <nav class="botoes-container">
        <button class="btn" onclick="abrirModalPresentes()">🎁 SUGESTÃO DE PRESENTE</button>
        <a id="link-maps" class="btn" target="_blank" rel="noopener noreferrer">📍 LOCALIZAÇÃO</a>
        <button class="btn" onclick="confirmarPresenca()">✅ CONFIRMAR PRESENÇA</button>
        <a id="link-grupo" class="btn" target="_blank" rel="noopener noreferrer">💬 GRUPO DA FESTA</a>
      </nav>
    </div>

  </main>

  <!-- MODAL DE PRESENTES -->
  <div id="modal-presentes" class="modal-overlay">
    <div class="modal-card">
      <h3>Sugestões de Presentes</h3>
      <ul id="lista-presentes"></ul>
      <button class="btn btn-fechar" onclick="fecharModalPresentes()">Fechar</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
