<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Convite Especial | Ágatha</title>
  <link rel="stylesheet" href="css/style.css?v=5.0">
</head>
<body>

  <!-- IMAGEM DE FUNDO ESTÁTICA -->
  <img id="bg-imagem" src="assets/fundo.png" alt="Fundo do Convite">

  <!-- ÁUDIO DE FUNDO -->
  <audio id="audio-fundo" loop></audio>

  <main class="card-container">
    
    <!-- TELA 1: CAPA COM ENVELOPE -->
    <div id="tela-envelope" class="secao-envelope" onclick="abrirConvite()">
      <h2 class="titulo-envelope">Você recebeu um convite especial!</h2>
      <p class="instrucao-envelope">Clique no envelope para abrir</p>
      <div class="envelope-wrapper">
        <img id="img-envelope" src="assets/envelope.png" alt="Envelope do Convite">
      </div>
    </div>

    <!-- TELA 2: CONTEÚDO PRINCIPAL (INICIA OCULTO) -->
    <div id="tela-principal" class="secao-principal oculto">
      <span class="subtitulo-topo">VAMOS COMEMORAR!</span>
      <h1 id="txt-nome" class="nome-destaque"></h1>
      <h2 id="txt-idade" class="idade-destaque"></h2>

      <div class="bloco-data-local">
        <p id="txt-data" class="txt-data"></p>
        <p id="txt-horario" class="txt-horario"></p>
        <p id="txt-local" class="txt-local"></p>
      </div>

      <!-- BOTÕES DE INTERAÇÃO -->
      <nav class="botoes-container">
        <button class="btn btn-principal" onclick="abrirModalPresentes()">🎁 SUGESTÃO DE PRESENTE</button>
        <a id="link-maps" class="btn btn-principal" target="_blank" rel="noopener noreferrer">📍 LOCALIZAÇÃO</a>
        <button class="btn btn-destaque" onclick="confirmarPresenca()">✅ CONFIRMAR PRESENÇA</button>
      </nav>

      <!-- RODAPÉ DE ASSINATURA WILLTECH SYSTEMS -->
      <footer class="rodape-dev">
        <p>Desenvolvido por <strong>WillTech Systems</strong></p>
        <div class="links-dev">
          <a href="mailto:willtech2003@gmail.com">✉️ E-mail</a> | 
          <a href="https://wa.me/5563992026738?text=Ol%C3%A1%2C%20gostaria%20de%20um%20orcamento%20de%20site%2Fconvite!" target="_blank" rel="noopener noreferrer">📱 WhatsApp</a>
        </div>
      </footer>
    </div>

  </main>

  <!-- MODAL DE PRESENTES -->
  <div id="modal-presentes" class="modal-overlay">
    <div class="modal-card">
      <h3>Sugestões de Presentes</h3>
      <ul id="lista-presentes"></ul>
      <button class="btn btn-fechar" onclick="fecharModalPresentes()">Fechar</button>
    </div>
  </div>

  <script src="js/config.js?v=5.0"></script>
  <script src="js/main.js?v=5.0"></script>
</body>
</html>
